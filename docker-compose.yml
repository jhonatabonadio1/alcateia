# O Alcateia online, inteiro, numa máquina:
#
#   cp .env.exemplo .env      (e troque as senhas)
#   docker compose up -d --build
#
# Sobe o banco, o servidor (http://localhost:8080), o painel
# administrativo (http://localhost:8443, só nesta máquina) e um servidor
# de partida (porta 7777/UDP). Veja docs/SERVIDOR.md e docs/PAINEL.md.
#
# Para a internet, com HTTPS, some o docker-compose.producao.yml
# (docs/SEGURANCA.md).

name: alcateia

services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alcateia
      POSTGRES_PASSWORD: ${ALCATEIA_DB_PASSWORD:?defina ALCATEIA_DB_PASSWORD no arquivo .env}
      POSTGRES_DB: alcateia
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alcateia -d alcateia"]
      interval: 5s
      timeout: 3s
      retries: 10
    # O banco não é exposto para fora: só o servidor fala com ele.

  servidor:
    build:
      context: .
      dockerfile: servidor/Dockerfile
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      ALCATEIA_DB_HOST: banco
      ALCATEIA_DB_PASSWORD: ${ALCATEIA_DB_PASSWORD}
      ALCATEIA_FLEET_KEY: ${ALCATEIA_FLEET_KEY:?defina ALCATEIA_FLEET_KEY no arquivo .env}
      # Cifra o que não pode ficar legível no banco (docs/SEGURANCA.md).
      ALCATEIA_MASTER_KEY: ${ALCATEIA_MASTER_KEY:?defina ALCATEIA_MASTER_KEY no arquivo .env}
      # O primeiro administrador do painel (só vale enquanto não há nenhum).
      ALCATEIA_ADMIN_USER: ${ALCATEIA_ADMIN_USER:-}
      ALCATEIA_ADMIN_PASSWORD: ${ALCATEIA_ADMIN_PASSWORD:-}
      ALCATEIA_ADMIN_REQUIRE_2FA: ${ALCATEIA_ADMIN_REQUIRE_2FA:-0}
      ALCATEIA_ADMIN_ALLOW: ${ALCATEIA_ADMIN_ALLOW:-}
      ALCATEIA_TRUSTED_PROXIES: ${ALCATEIA_TRUSTED_PROXIES:-}
      ALCATEIA_IP_ALLOW: ${ALCATEIA_IP_ALLOW:-}
      ALCATEIA_METRICS_KEY: ${ALCATEIA_METRICS_KEY:-}
    ports:
      - "${ALCATEIA_PORT:-8080}:8080"
      # O painel só na própria máquina: de fora, por túnel SSH ou VPN
      # (ssh -L 8443:127.0.0.1:8443 usuario@servidor). Nunca "0.0.0.0".
      # Na máquina, 8443 (Jhon, 24/11: a mesma porta do painel no Fly); dentro
      # do contêiner o painel segue na 8081.
      - "127.0.0.1:${ALCATEIA_ADMIN_PORT:-8443}:8081"
    # O contêiner não ganha privilégio nem escreve no próprio disco.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  partida:
    build:
      context: .
      dockerfile: servidor/partida.Dockerfile
    restart: unless-stopped
    depends_on:
      servidor:
        condition: service_healthy
    environment:
      ALCATEIA_API: http://servidor:8080
      ALCATEIA_FLEET_KEY: ${ALCATEIA_FLEET_KEY}
      # O endereço que os jogadores usam para chegar nesta máquina.
      ALCATEIA_PUBLIC_ADDRESS: ${ALCATEIA_PUBLIC_ADDRESS:-127.0.0.1}
      ALCATEIA_GAME_PORT: 7777
      # Quantas partidas este servidor de partida joga ao mesmo tempo.
      ALCATEIA_MATCHES: ${ALCATEIA_MATCHES:-4}
      # "autoritativo": o servidor de partida move os corpos (decisão 0011).
      ALCATEIA_NETCODE: ${ALCATEIA_NETCODE:-}
    ports:
      - "7777:7777/udp"

volumes:
  banco:
