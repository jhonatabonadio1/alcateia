# O Prometheus lê os números do servidor (GET /metrics, na porta do painel).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: wolfleague
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/chave
    static_configs:
      - targets: ["servidor:8081"]
