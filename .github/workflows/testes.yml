# Roda todos os testes a cada push e pull request: compila o jogo, os
# testes de unidade e os de regressão (o jogo de verdade, sem tela).
# É o mesmo src/tools/testar.sh que roda no Mac. O lançamento
# (lancamento.yml) não espera por ele desde 27/11 (o workflow_call fica
# para religar).
name: Testes

on:
  push:
    # Só ramos: a tag de lançamento não roda os testes (o push do ramo roda).
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # A semente do servidor (o que o painel conhece: armas, skins, mapas)
  # tem de estar em dia com o código do jogo. Entrou item no jogo e
  # ninguém rodou o exportar_dados.py? Falha aqui, antes de chegar à
  # produção sem aparecer no painel.
  semente:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: A semente bate com o jogo
        run: |
          python3 src/tools/servidor/exportar_dados.py
          if ! git diff --quiet -- servidor/Alcateia.Infra/Semente/jogo.json; then
            echo "::error file=servidor/Alcateia.Infra/Semente/jogo.json::A semente está velha. Rode: python3 src/tools/servidor/exportar_dados.py e faça commit."
            git --no-pager diff --stat -- servidor/Alcateia.Infra/Semente/jogo.json
            exit 1
          fi
      - name: Itens sem foto na loja
        run: |
          python3 - <<'PY'
          import json
          dados = json.load(open('servidor/Alcateia.Infra/Semente/jogo.json', encoding='utf-8'))
          sem = [i['id'] for i in dados.get('catalog', []) if i.get('kind') in ('weapon', 'utility', 'skin') and not i.get('image')]
          for i in sem:
              print(f'::warning::item sem foto na loja (rode o WeaponPhotos no editor): {i}')
          PY

  # O iniciador do Windows (instalador/iniciador.nsi) num Windows de
  # verdade, com um jogo de mentira que falha nos modos de vídeo pedidos:
  # a ordem das tentativas, o modo guardado, o escolhido nas Opções e o
  # aviso quando nada abre. É ele que garante que o jogo nunca "não abre
  # sem dizer nada".
  #
  # Compila no Ubuntu e testa no Windows: o iniciador é de 64 bits
  # (Target amd64-unicode), e o NSIS oficial de Windows (o do runner e do
  # choco) só traz os stubs x86 ("reading stub zlib-amd64-unicode"). O do
  # apt traz os amd64, e é com ele que o lancamento.yml compila o que vai
  # para o jogador, então o teste roda o mesmo binário.
  iniciador-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o iniciador e o jogo de mentira
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis
          mkdir -p pronto
          makensis -V2 -DSAIDA="$PWD/pronto/WolfLeague.exe" "$PWD/instalador/iniciador.nsi"
          makensis -V2 -DSAIDA="$PWD/pronto/jogo_falso.exe" "$PWD/instalador/teste/jogo_falso.nsi"
          ls -la pronto
      - uses: actions/upload-artifact@v4
        with:
          name: iniciador-teste
          path: pronto/*
          if-no-files-found: error

  iniciador:
    needs: iniciador-compilar
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iniciador-teste
          path: pronto
      - name: Iniciador
        shell: pwsh
        run: ./instalador/teste/testar_iniciador.ps1 -Pronto pronto

  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Godot ${{ env.GODOT_VERSION }} (.NET)
        id: godot
        run: |
          nome="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${nome}.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "bin=$HOME/godot/${nome}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_OUTPUT"

      - name: Importar os assets
        run: |
          dotnet build WolfLeague.csproj --nologo -v quiet
          "${{ steps.godot.outputs.bin }}" --headless --path . --import || true

      - name: Testes
        env:
          GODOT: ${{ steps.godot.outputs.bin }}
        run: bash src/tools/testar.sh
