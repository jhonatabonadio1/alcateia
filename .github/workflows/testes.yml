# Roda todos os testes a cada push e pull request: compila o jogo, os
# testes de unidade e os de regressão (o jogo de verdade, sem tela).
# É o mesmo tools/testar.sh que roda no Mac.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Godot ${{ env.GODOT_VERSION }} (.NET)
        id: godot
        run: |
          nome="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${nome}.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "bin=$HOME/godot/${nome}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_OUTPUT"

      - name: Importar os assets
        run: |
          dotnet build alcateia.csproj --nologo -v quiet
          "${{ steps.godot.outputs.bin }}" --headless --path . --import || true

      - name: Testes
        env:
          GODOT: ${{ steps.godot.outputs.bin }}
        run: tools/testar.sh
