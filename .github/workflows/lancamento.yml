# Lançamento: uma tag "v*" (git tag v0.4.0 && git push --tags) roda os
# testes e, passando, sobe o servidor e a frota de partidas no Fly.io, monta
# o jogo para Windows e para Mac e, só quando tudo isso deu certo,
# publica a Release do GitHub (o link que vai para os testadores) com:
#   WolfLeague-Setup-<versão>.exe   instalador do Windows (atalhos, desinstalador)
#   WolfLeague-<versão>-windows.zip Windows portátil, sem instalar
#   WolfLeague-<versão>-mac.dmg     Mac (Intel e Apple Silicon): arrastar para Aplicativos
#   SHA256SUMS.txt                  para conferir o download
# O jogo sai apontando para https://<FLY_APP_API>.fly.dev (ou para a
# variável SERVIDOR_URL, se existir) e com a versão da tag.
# Tag com hífen (v0.4.0-alpha.1) sai como pré-lançamento.
# Também dá para rodar à mão (aba Actions → Lançamento → Run workflow):
# sem tag não há Release, o instalador fica como artefato do workflow.
#
# Com a Release pronta, o **cliente de instalação** (cliente/LEIA-ME.md): os
# jobs "lancador" e "lancador-mac" empacotam o jogo e o próprio cliente em
# pedaços, e o "distribuir" sobe tudo para o Cloudflare R2, de onde o cliente
# baixa (a Release do GitHub é de repositório privado: só baixa quem tem
# login). Lá ficam, sempre com o mesmo nome, o manifesto da última versão de
# cada produto (wolfleague-windows.manifest.json, launcher-windows…) e os
# instaladores do cliente (WolfLeague-Launcher-Setup.exe, …-mac-arm64.dmg,
# …-mac-x64.dmg); os pacotes de cada versão ficam em v<versão>/.
# Esses três jobs vêm depois da Release e não a seguram: se o R2 falhar, o
# instalador de sempre já saiu.
#
# Configuração de uma vez (docs/FLY.md):
#   segredo  FLY_API_TOKEN       token que pode fazer deploy nos dois apps
#   variável FLY_APP_API         (opcional) padrão wolfleague-api
#   variável FLY_APP_PARTIDA     (opcional) padrão wolfleague-partida
#   variável SERVIDOR_URL        (opcional) padrão https://<FLY_APP_API>.fly.dev
# **Os links do site** (sempre a última versão; não mudam de uma versão para outra):
#   <R2_PUBLIC_URL>/WolfLeague-Launcher-Setup.exe        Windows
#   <R2_PUBLIC_URL>/WolfLeague-Launcher-mac-arm64.dmg    Mac com Apple Silicon
#   <R2_PUBLIC_URL>/WolfLeague-Launcher-mac-x64.dmg      Mac com Intel
#   <R2_PUBLIC_URL>/latest.json                          versão, tamanho e SHA-256 de cada um
# O "distribuir" confere que respondem sem login e os escreve no resumo da execução.
#
# Para o cliente de instalação (sem eles, os três jobs são pulados):
#   segredo  R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   token de API do R2, leitura e escrita no balde
#   variável ou segredo R2_BUCKET_NAME   o balde
#   variável ou segredo R2_PUBLIC_URL    o endereço público do balde (https://pub-….r2.dev ou um domínio).
#                                Não é segredo: como variável, os links aparecem inteiros no resumo
#                                (como segredo, o GitHub os troca por ***)
#   variável R2_ENDPOINT         (opcional) a API S3 da conta; padrão, a da conta do projeto
name: Lançamento

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Um lançamento por vez: dois deploys ao mesmo tempo no mesmo app brigam.
concurrency:
  group: lancamento
  cancel-in-progress: false

permissions:
  contents: write   # criar a Release com o instalador

env:
  GODOT_VERSION: 4.7.2
  FLY_APP_API: ${{ vars.FLY_APP_API || 'wolfleague-api' }}
  FLY_APP_PARTIDA: ${{ vars.FLY_APP_PARTIDA || 'wolfleague-partida' }}
  SERVIDOR_URL: ${{ vars.SERVIDOR_URL || format('https://{0}.fly.dev', vars.FLY_APP_API || 'wolfleague-api') }}
  # A API S3 do Cloudflare R2 (o número é o da conta; não é segredo).
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT || 'https://969ab96ae86fb74cc06954dd82147e57.r2.cloudflarestorage.com' }}

# Os testes voltaram ao lançamento (Jhon, 27/11: "pode voltar os testes no
# ci"; tinham saído em 21/11 e em 26/11, e voltado em 25/11):
# nada sobe para o Fly nem vira Release sem o testes.yml inteiro passar. O
# import do Godot (o job mais demorado) roda ao mesmo tempo que eles; os
# clientes esperam os dois.
jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  # O servidor (API, saguão, painel). Sobe primeiro: a versão nova da
  # frota pode depender de rota nova dele; a velha continua falando com ele.
  servidor:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    env:
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # O servidor diz ao cliente de instalação de onde baixar (GET /v1/client).
      # "--stage" só guarda o valor: ele entra no deploy logo abaixo, sem
      # reiniciar o servidor uma vez a mais.
      - name: Endereço dos downloads
        if: env.R2_PUBLIC_URL != ''
        run: flyctl secrets set ALCATEIA_DOWNLOADS="${R2_PUBLIC_URL%/}/" --app "$FLY_APP_API" --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy do servidor
        run: flyctl deploy --config fly.servidor.toml --app "$FLY_APP_API" --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Saúde
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${FLY_APP_API}.fly.dev/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::o servidor não respondeu /health depois do deploy"
          exit 1

  # A frota: constrói a imagem do servidor de partida e troca nas máquinas.
  # As paradas trocam na hora; as ligadas também, se não há partida em curso
  # (o /health do servidor); com partida, esperam desligar sozinhas, até 20
  # minutos — ninguém cai no meio da partida.
  partida:
    needs: servidor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Imagem do servidor de partida
        id: imagem
        # Monta aqui no runner e envia com "docker push": quando o push volta,
        # a imagem está no registro. Com "flyctl deploy --build-only --push"
        # no construtor remoto, o envio às vezes chegava depois (ou nunca) e
        # as máquinas recebiam MANIFEST_UNKNOWN.
        run: |
          rotulo="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          ref="registry.fly.io/${FLY_APP_PARTIDA}:${rotulo}"
          flyctl auth docker
          docker build -f servidor/partida.Dockerfile -t "$ref" .
          docker push "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Trocar a imagem nas máquinas
        run: |
          # Sem partida em curso (o /health do servidor diz), a máquina ligada
          # (a reserva da frota, que nunca desliga sozinha) troca na hora.
          python3 src/tools/fly/frota.py --app "$FLY_APP_PARTIDA" atualizar \
            --imagem "${{ steps.imagem.outputs.ref }}" --esperar 1200 \
            --saude "https://${FLY_APP_API}.fly.dev/health"
          python3 src/tools/fly/frota.py --app "$FLY_APP_PARTIDA" estado
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # O import do Godot (as texturas comprimidas em BPTC de alta qualidade:
  # uns 2,5 GB em .godot/imported) feito uma vez, no Linux, e guardado no
  # cache do Actions. O Windows e o Mac só restauram e exportam. No Mac o
  # runner não tem GPU e o Godot comprimia tudo na CPU ARM: passou de 50 min
  # e foi cancelado (21/11). E minuto de Mac custa 10 vezes o de Linux.
  # Cada execução parte do cache da anterior: só o que mudou é refeito.
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      chave: ${{ steps.chave.outputs.chave }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Chave do cache
        id: chave
        run: echo "chave=godot-importado-${GODOT_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Import da execução anterior
        uses: actions/cache/restore@v4
        with:
          path: .godot/imported
          key: ${{ steps.chave.outputs.chave }}
          restore-keys: godot-importado-${{ env.GODOT_VERSION }}-
      - name: Godot ${{ env.GODOT_VERSION }} (.NET)
        run: |
          nome="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "${base}/${nome}.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/${nome}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Importar
        run: |
          dotnet build WolfLeague.csproj --nologo -v quiet
          "$GODOT" --headless --path . --import || true
          du -sh .godot/imported
      - uses: actions/cache/save@v4
        with:
          path: .godot/imported
          key: ${{ steps.chave.outputs.chave }}

  # O jogo para Windows, apontando para o servidor de produção: exporta,
  # empacota o instalador (instalador/windows.nsi) e guarda como artefato.
  # Roda ao mesmo tempo que o deploy; quem publica é o job "release".
  cliente:
    needs: [testes, importar]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Import pronto (job "importar")
        uses: actions/cache/restore@v4
        with:
          path: .godot/imported
          key: ${{ needs.importar.outputs.chave }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Versão e endereço de produção
        id: versao
        run: |
          # tag v0.4.0-alpha.1 -> 0.4.0-alpha.1; sem tag, uma versão de teste
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          # o Windows quer quatro números: 0.4.0-alpha.1 -> 0.4.0.0
          n="$(echo "${v%%-*}" | awk -F. '{printf "%d.%d.%d.0", $1, $2, $3}')"
          echo "versao=$v" >> "$GITHUB_OUTPUT"
          echo "numero=$n" >> "$GITHUB_OUTPUT"
          python3 src/tools/lancamento/preparar_build.py --versao "$v" --numero "$n" --servidor "$SERVIDOR_URL"
      - name: Godot ${{ env.GODOT_VERSION }} (.NET) e os modelos de exportação
        run: |
          nome="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "${base}/${nome}.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/${nome}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          curl -sSL -o modelos.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          destino="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$destino"
          unzip -q modelos.tpz -d modelos
          mv modelos/templates/* "$destino/"
      - name: Exportar para Windows
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          dotnet build WolfLeague.csproj --nologo -v quiet
          "$GODOT" --headless --path . --import || true
          # O jogo vai em game\; o WolfLeague.exe de fora é o iniciador
          # (próximo passo), que acha o modo de vídeo que funciona.
          mkdir -p build/windows/game
          # O Godot .NET sem tela às vezes cai ao fechar, depois de gravar tudo
          # ("[ DONE ] savepack" e em seguida "Segmentation fault"; 24/11). A
          # exportação vale se o pack terminou e os arquivos estão lá; se caiu
          # antes, tenta de novo uma vez.
          exportar() {
            rm -f build/windows/game/WolfLeague.exe build/windows/game/WolfLeague.pck
            set +e
            "$GODOT" --headless --path . --export-release "Windows" build/windows/game/WolfLeague.exe 2>&1 | tee export.log
            codigo=${PIPESTATUS[0]}
            set -e
            if [ "$codigo" -ne 0 ]; then
              echo "::warning::o Godot saiu com o código $codigo"
              grep -q "DONE \] savepack" export.log || return 1
              [ -s build/windows/game/WolfLeague.exe ] && [ -s build/windows/game/WolfLeague.pck ] || return 1
              echo "o pack terminou antes da queda: a exportação vale"
            fi
          }
          exportar || { echo "::warning::exportação incompleta, tentando de novo"; exportar; }
          test -f build/windows/game/WolfLeague.exe
          test -f build/windows/game/WolfLeague.pck
          ls -la build/windows/game
      - name: Iniciador, .zip e instalador do Windows
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
          NUMERO: ${{ steps.versao.outputs.numero }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis
          # O iniciador (instalador/iniciador.nsi): tenta Vulkan, DirectX 12 e
          # compatibilidade, guarda o que abriu e avisa se nada abrir.
          makensis -V2 -DVERSAO_NUM="$NUMERO" -DSAIDA="$PWD/build/windows/WolfLeague.exe" "$PWD/instalador/iniciador.nsi"
          test -f build/windows/WolfLeague.exe
          (cd build/windows && zip -qr "../WolfLeague-${VERSAO}-windows.zip" .)
          ls -la build build/windows
          python3 instalador/gerar_lista.py build/windows build/desinstalar.nsh
          # O .nsi com caminho absoluto: o makensis entra na pasta do script
          # antes de compilar, e a arte (o ícone, os painéis) vem de
          # ${__FILEDIR__}. Relativo, virava instalador/instalador/...
          makensis -V2 -DVERSAO="$VERSAO" -DVERSAO_NUM="$NUMERO" \
            -DORIGEM="$PWD/build/windows" -DLISTA="$PWD/build/desinstalar.nsh" \
            -DSAIDA="$PWD/build/WolfLeague-Setup-${VERSAO}.exe" "$PWD/instalador/windows.nsi"
          mkdir -p entrega
          cp "build/WolfLeague-Setup-${VERSAO}.exe" "build/WolfLeague-${VERSAO}-windows.zip" entrega/
          ls -la entrega
      - uses: actions/upload-artifact@v4
        with:
          name: wolfleague-windows
          path: entrega/*
          if-no-files-found: error

  # O jogo para Mac, exportado num Mac de verdade (o Godot .NET exporta o
  # .app universal, Intel + Apple Silicon, com assinatura ad hoc) e posto
  # num .dmg com o atalho para Aplicativos. Sem conta de desenvolvedor da
  # Apple, não é autenticado: na primeira vez o jogador libera em
  # Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim.
  cliente-mac:
    needs: [testes, importar]
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Import pronto (job "importar")
        id: importado
        uses: actions/cache/restore@v4
        with:
          path: .godot/imported
          key: ${{ needs.importar.outputs.chave }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Versão e endereço de produção
        id: versao
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          n="$(echo "${v%%-*}" | awk -F. '{printf "%d.%d.%d.0", $1, $2, $3}')"
          echo "versao=$v" >> "$GITHUB_OUTPUT"
          python3 src/tools/lancamento/preparar_build.py --versao "$v" --numero "$n" --servidor "$SERVIDOR_URL"
      - name: Godot ${{ env.GODOT_VERSION }} (.NET) e os modelos de exportação
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          ditto -x -k godot.zip "$HOME/godot"
          echo "GODOT=$(find "$HOME/godot" -maxdepth 4 -path '*Contents/MacOS/Godot' | head -1)" >> "$GITHUB_ENV"
          curl -sSL -o modelos.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          destino="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$destino"
          unzip -q modelos.tpz -d modelos
          mv modelos/templates/* "$destino/"
      - name: Exportar para Mac
        run: |
          test -x "$GODOT"
          if [ "${{ steps.importado.outputs.cache-hit }}" != "true" ]; then
            echo "::warning::o import do Linux não veio do cache: o Mac vai comprimir as texturas sozinho (demora)"
          fi
          dotnet build WolfLeague.csproj --nologo -v quiet
          "$GODOT" --headless --path . --import || true
          mkdir -p build/macos
          # Como no Windows: a queda ao fechar, depois de gravar tudo, não reprova.
          exportar() {
            rm -f build/macos/WolfLeague.zip
            set +e
            "$GODOT" --headless --path . --export-release "macOS" build/macos/WolfLeague.zip 2>&1 | tee export.log
            codigo=${PIPESTATUS[0]}
            set -e
            if [ "$codigo" -ne 0 ]; then
              echo "::warning::o Godot saiu com o código $codigo"
              grep -q "DONE \] savepack" export.log || return 1
              [ -s build/macos/WolfLeague.zip ] && unzip -tq build/macos/WolfLeague.zip >/dev/null || return 1
              echo "o pack terminou antes da queda: a exportação vale"
            fi
          }
          exportar || { echo "::warning::exportação incompleta, tentando de novo"; exportar; }
          ditto -x -k build/macos/WolfLeague.zip build/macos/app
          ls build/macos/app
      - name: Imagem de disco (.dmg)
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          app="$(find build/macos/app -maxdepth 1 -name '*.app' | head -1)"
          test -d "$app"
          # O Godot exporta sem assinar (export_presets.cfg, codesign=0): o
          # assinador embutido dele grava as permissões de um jeito que o macOS
          # recusa, e o jogo morre ao abrir ("killed", 21/11). Assinatura ad hoc
          # com o codesign do próprio Mac, sem hardened runtime; não conferiu,
          # não sai .dmg.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p dmg && cp -R "$app" dmg/WolfLeague.app && ln -s /Applications dmg/Applications
          mkdir -p entrega
          hdiutil create -volname "WolfLeague" -srcfolder dmg -ov -format UDZO "entrega/WolfLeague-${VERSAO}-mac.dmg"
          ls -la entrega
      - uses: actions/upload-artifact@v4
        with:
          name: wolfleague-mac
          path: entrega/*
          if-no-files-found: error

  # A Release. Só com tag, e só depois de o servidor e a frota estarem no ar
  # e o instalador pronto: ninguém baixa um jogo que aponta para um servidor
  # que não subiu. Se o workflow for rodado de novo na mesma tag, troca os
  # arquivos da Release que já existe em vez de falhar.
  release:
    if: success() && startsWith(github.ref, 'refs/tags/v')
    needs: [servidor, partida, cliente, cliente-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: instalador/capa.png
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: wolfleague-*
          merge-multiple: true
          path: entrega
      - name: Conferência
        run: (cd entrega && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          versao="${TAG#v}"
          instalador="WolfLeague-Setup-${versao}.exe"
          dmg="WolfLeague-${versao}-mac.dmg"
          test -f "entrega/${instalador}"
          test -f "entrega/${dmg}"
          repo_raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/instalador/capa.png"
          {
            echo "![WolfLeague](${repo_raw})"
            echo
            echo "## Windows 10 ou 11"
            echo
            echo "1. Baixe **${instalador}** aqui embaixo e execute."
            echo "2. O Windows pode avisar \"O Windows protegeu o computador\" (o instalador ainda não é assinado): clique em **Mais informações** e depois em **Executar assim mesmo**."
            echo "3. Siga o instalador. Ele cria atalhos na Área de Trabalho e no Menu Iniciar."
            echo
            echo "Para atualizar, rode o instalador da versão nova por cima. Para desinstalar: Configurações → Aplicativos. A sua conta e os seus ajustes não são apagados."
            echo
            echo "Sem instalar: baixe o **-windows.zip**, extraia numa pasta e abra WolfLeague.exe."
            echo
            echo "## Mac (Intel ou Apple Silicon, macOS 11 ou mais novo)"
            echo
            echo "1. Baixe **${dmg}**, abra e arraste o WolfLeague para **Applications** (Aplicativos)."
            echo "2. Na primeira vez o Mac bloqueia (o jogo ainda não é autenticado pela Apple). Abra **Ajustes do Sistema → Privacidade e Segurança**, role até o aviso do WolfLeague e clique em **Abrir Mesmo Assim**."
            echo
            echo "O **SHA256SUMS.txt** serve para conferir os downloads."
            echo
            echo "---"
          } > notas.md
          # Sem --prerelease (Jhon, 24/11: "por que a release não aparece
          # aqui"): o GitHub só mostra na lateral do repositório a release
          # marcada como a mais recente, e pre-release nunca é a mais recente;
          # com todas as versões em alpha, a lateral ficava em "Create a new
          # release". O "alpha" já está no nome da tag e na capa.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" entrega/* --clobber
            gh release edit "$TAG" --prerelease=false --latest
          else
            gh release create "$TAG" entrega/* --latest --title "WolfLeague $TAG" \
              --notes-file notas.md --generate-notes
          fi

  # ---------------------------------------------------------------------
  # O cliente de instalação (cliente/LEIA-ME.md). Vem depois da Release e
  # não a segura.

  # Windows: empacota o jogo que o job "cliente" exportou (o .zip dele é a
  # pasta inteira), publica o cliente, empacota o cliente e monta o
  # instalador dele (instalador/cliente.nsi).
  lancador:
    if: success() && startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
    steps:
      - name: Há onde publicar?
        id: r2
        run: |
          if [ -n "$R2_PUBLIC_URL" ]; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "::notice::sem R2_PUBLIC_URL: o cliente de instalação não é publicado"; fi
      - uses: actions/checkout@v4
        if: steps.r2.outputs.sim
      - uses: actions/setup-dotnet@v4
        if: steps.r2.outputs.sim
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        if: steps.r2.outputs.sim
        with:
          name: wolfleague-windows
          path: entrada
      - name: Empacotar o jogo e o cliente
        if: steps.r2.outputs.sim
        run: |
          v="${GITHUB_REF_NAME#v}"
          n="$(echo "${v%%-*}" | awk -F. '{printf "%d.%d.%d.0", $1, $2, $3}')"
          base="${R2_PUBLIC_URL%/}/v${v}/"
          pacote() { dotnet run --project cliente/Alcateia.Pacote.Ferramenta -c Release -- "$@"; }
          python3 src/tools/lancamento/notas.py docs/CHANGELOG.md > notas.txt
          mkdir -p jogo saida

          unzip -q "entrada/WolfLeague-${v}-windows.zip" -d jogo
          test -f jogo/WolfLeague.exe
          pacote empacotar --origem jogo --saida saida --produto wolfleague --plataforma windows \
            --versao "$v" --exe WolfLeague.exe --base "$base" --notas notas.txt

          dotnet publish cliente/Alcateia.Cliente/Alcateia.Cliente.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=true -p:TrimMode=partial -p:DebugType=none \
            -p:Version="$v" -p:ServidorUrl="$SERVIDOR_URL" -o cliente-win --nologo -v quiet
          rm -f cliente-win/*.pdb
          test -f cliente-win/WolfLeagueLauncher.exe
          pacote empacotar --origem cliente-win --saida saida --produto launcher --plataforma windows \
            --versao "$v" --exe WolfLeagueLauncher.exe --base "$base"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis
          makensis -V2 -DVERSAO="$v" -DVERSAO_NUM="$n" -DORIGEM="$PWD/cliente-win" \
            -DSAIDA="$PWD/saida/WolfLeague-Launcher-Setup-${v}.exe" "$PWD/instalador/cliente.nsi"
          ls -la saida
      - uses: actions/upload-artifact@v4
        if: steps.r2.outputs.sim
        with:
          name: lancador-windows
          path: saida/*
          if-no-files-found: error
          retention-days: 3

  # Mac: o mesmo, num Mac (o cliente precisa do codesign). O jogo vem do .dmg
  # que o job "cliente-mac" montou; o cliente sai um por processador.
  lancador-mac:
    if: success() && startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
    steps:
      - name: Há onde publicar?
        id: r2
        run: |
          if [ -n "$R2_PUBLIC_URL" ]; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "::notice::sem R2_PUBLIC_URL: o cliente de instalação não é publicado"; fi
      - uses: actions/checkout@v4
        if: steps.r2.outputs.sim
      - uses: actions/setup-dotnet@v4
        if: steps.r2.outputs.sim
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        if: steps.r2.outputs.sim
        with:
          name: wolfleague-mac
          path: entrada
      - name: Empacotar o jogo e o cliente
        if: steps.r2.outputs.sim
        run: |
          v="${GITHUB_REF_NAME#v}"
          base="${R2_PUBLIC_URL%/}/v${v}/"
          pacote() { dotnet run --project cliente/Alcateia.Pacote.Ferramenta -c Release -- "$@"; }
          python3 src/tools/lancamento/notas.py docs/CHANGELOG.md > notas.txt
          mkdir -p jogo saida

          # O jogo: o WolfLeague.app de dentro do .dmg, já assinado.
          hdiutil attach "entrada/WolfLeague-${v}-mac.dmg" -nobrowse -readonly -mountpoint montado
          cp -R montado/WolfLeague.app jogo/WolfLeague.app
          hdiutil detach montado
          codesign --verify --deep --strict jogo/WolfLeague.app
          exe="WolfLeague.app/Contents/MacOS/$(ls jogo/WolfLeague.app/Contents/MacOS | head -1)"
          pacote empacotar --origem jogo --saida saida --produto wolfleague --plataforma mac \
            --versao "$v" --exe "$exe" --base "$base" --notas notas.txt

          for arq in arm64 x64; do
            src/tools/lancamento/cliente_mac.sh "$v" "$arq" "cliente-$arq"
            pacote empacotar --origem "cliente-$arq/WolfLeague.app" --saida saida --produto launcher --plataforma "mac-$arq" \
              --versao "$v" --exe Contents/MacOS/WolfLeagueLauncher --base "$base"
            cp "cliente-$arq/WolfLeague-Launcher-${v}-mac-$arq.dmg" saida/
          done
          ls -la saida
      - uses: actions/upload-artifact@v4
        if: steps.r2.outputs.sim
        with:
          name: lancador-mac
          path: saida/*
          if-no-files-found: error
          retention-days: 3

  # Sobe tudo para o R2. A ordem importa: primeiro os pacotes da versão,
  # depois os instaladores, e só no fim os manifestos — é o manifesto que
  # diz ao cliente "há versão nova", e ele não pode apontar para pacote que
  # ainda não chegou. Depois confere pelo endereço público, como um jogador:
  # o manifesto responde, um pacote aceita download em partes, e o pacote do
  # cliente instala inteiro.
  distribuir:
    if: success() && startsWith(github.ref, 'refs/tags/v')
    needs: [lancador, lancador-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # O R2 não entende a conferência nova (CRC64) que o aws-cli passou a mandar por padrão.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Há onde publicar?
        id: r2
        run: |
          if [ -n "$R2_PUBLIC_URL" ] && [ -n "$R2_BUCKET_NAME" ] && [ -n "$AWS_ACCESS_KEY_ID" ]; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "::notice::faltam os segredos do R2: nada é publicado"; fi
      - uses: actions/checkout@v4
        if: steps.r2.outputs.sim
      - uses: actions/setup-dotnet@v4
        if: steps.r2.outputs.sim
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        if: steps.r2.outputs.sim
        with:
          pattern: lancador-*
          merge-multiple: true
          path: saida
      - name: Subir para o R2
        if: steps.r2.outputs.sim
        run: |
          v="${GITHUB_REF_NAME#v}"
          balde="s3://${R2_BUCKET_NAME}"
          r2() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --no-progress; }
          ls -la saida

          # 1. Os pacotes: nome com a versão, nunca mudam.
          r2 cp saida "$balde/v${v}/" --recursive --exclude "*" --include "*.pack" \
            --cache-control "public, max-age=31536000, immutable"

          # 2. Os instaladores do cliente, com a versão e com o nome fixo (o link do site).
          for f in saida/WolfLeague-Launcher-*; do
            r2 cp "$f" "$balde/v${v}/$(basename "$f")" --cache-control "public, max-age=31536000, immutable"
          done
          r2 cp "saida/WolfLeague-Launcher-Setup-${v}.exe" "$balde/WolfLeague-Launcher-Setup.exe" --cache-control "no-cache"
          r2 cp "saida/WolfLeague-Launcher-${v}-mac-arm64.dmg" "$balde/WolfLeague-Launcher-mac-arm64.dmg" --cache-control "no-cache"
          r2 cp "saida/WolfLeague-Launcher-${v}-mac-x64.dmg" "$balde/WolfLeague-Launcher-mac-x64.dmg" --cache-control "no-cache"

          # 3. Os manifestos, por último: a partir daqui os clientes veem a versão nova.
          for f in saida/*.manifest.json; do
            r2 cp "$f" "$balde/$(basename "$f")" --cache-control "no-cache" --content-type "application/json"
          done

          # 4. Para o site: a versão, o tamanho e o SHA-256 de cada instalador.
          python3 src/tools/lancamento/ultima_versao.py --versao "$v" --publico "$R2_PUBLIC_URL" --pasta saida > latest.json
          r2 cp latest.json "$balde/latest.json" --cache-control "no-cache" --content-type "application/json"
      - name: Conferir pelo endereço público
        if: steps.r2.outputs.sim
        run: |
          publico="${R2_PUBLIC_URL%/}"
          for m in wolfleague-windows wolfleague-mac launcher-windows launcher-mac-arm64 launcher-mac-x64; do
            curl -fsS -o /dev/null "$publico/$m.manifest.json" || { echo "::error::$m.manifest.json não baixa pelo endereço público: o balde está com o acesso público ligado?"; exit 1; }
          done
          # Baixa de verdade, em partes, como o cliente faz: o pacote do cliente do Windows inteiro.
          dotnet run --project cliente/Alcateia.Pacote.Ferramenta -c Release -- instalar \
            --manifesto "$publico/launcher-windows.manifest.json" --destino conferido
          test -f conferido/WolfLeagueLauncher.exe
          dotnet run --project cliente/Alcateia.Pacote.Ferramenta -c Release -- info --manifesto "$publico/wolfleague-windows.manifest.json"

          # Os links do site: respondem sem login, e o de nome fixo já é o desta versão.
          v="${GITHUB_REF_NAME#v}"
          for f in WolfLeague-Launcher-Setup.exe WolfLeague-Launcher-mac-arm64.dmg WolfLeague-Launcher-mac-x64.dmg latest.json; do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' -I "$publico/$f")"
            [ "$codigo" = 200 ] || { echo "::error::$f respondeu $codigo pelo endereço público"; exit 1; }
          done
          no_ar="$(curl -fsSL "$publico/WolfLeague-Launcher-Setup.exe" | sha256sum | cut -d' ' -f1)"
          daqui="$(sha256sum "saida/WolfLeague-Launcher-Setup-${v}.exe" | cut -d' ' -f1)"
          [ "$no_ar" = "$daqui" ] || { echo "::error::o WolfLeague-Launcher-Setup.exe do endereço público não é o desta versão (cópia antiga no caminho?)"; exit 1; }
      - name: Os links, no resumo
        if: steps.r2.outputs.sim
        run: |
          publico="${R2_PUBLIC_URL%/}"
          {
            echo "## Cliente de instalação ${GITHUB_REF_NAME} no ar"
            echo
            echo "Links fixos para o site (sempre a última versão):"
            echo
            echo "| Sistema | Link |"
            echo "|---|---|"
            echo "| Windows | $publico/WolfLeague-Launcher-Setup.exe |"
            echo "| Mac (Apple Silicon) | $publico/WolfLeague-Launcher-mac-arm64.dmg |"
            echo "| Mac (Intel) | $publico/WolfLeague-Launcher-mac-x64.dmg |"
            echo "| Versão, tamanho e SHA-256 | $publico/latest.json |"
            echo
            echo "Se os links aparecerem com \*\*\*, o endereço público está guardado como segredo: cadastre-o como **variável** (R2_PUBLIC_URL) e apague o segredo — ele não é segredo."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Os instaladores do cliente também na Release
        if: steps.r2.outputs.sim
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" saida/WolfLeague-Launcher-* --clobber
